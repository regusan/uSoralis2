name: Build

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  host:
    name: Host BMP
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            ca-certificates \
            cmake \
            g++ \
            ninja-build \
            wget
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key \
            | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc >/dev/null
          echo "deb https://apt.llvm.org/noble/ llvm-toolchain-noble-22 main" \
            | sudo tee /etc/apt/sources.list.d/llvm22.list
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            clang-format-22 \
            clang-tidy-22
          clang-format-22 --version
          clang-tidy-22 --version

      - name: Configure Debug
        run: cmake --preset debug

      - name: Check format
        run: cmake --build --preset debug --target format-check

      - name: Build Debug
        run: cmake --build --preset debug --parallel

      - name: Test Debug
        run: ctest --preset debug

      - name: Configure clang-tidy
        run: cmake --preset lint

      - name: Run clang-tidy
        run: cmake --build --preset lint --parallel

      - name: Configure Release
        run: cmake --preset release

      - name: Build Release
        run: cmake --build --preset release --parallel
